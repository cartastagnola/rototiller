<title>Puzzle Names Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* layout: sticky control bar, then one list per project; each row is proposal + verdict buttons, with an inline editor when you ask for a change */
:root {
  --bg: #f4f6f2; --surface: #ffffff; --ink: #1c2420; --muted: #5b6961; --line: #dce2db;
  --accent: #2b6b47; --accent-soft: #e3efe7;
  --ok: #2f7a3a; --ok-soft: #e4f2e5; --change: #b0521a; --change-soft: #fbeadd; --unsure: #8a6a00; --unsure-soft: #f6eecf;
  --f-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181d1a; --ink: #e2e9e4; --muted: #92a097; --line: #29312c;
  --accent: #74c095; --accent-soft: #1d2b23;
  --ok: #7cc485; --ok-soft: #1b2b1d; --change: #eba06a; --change-soft: #33231a; --unsure: #d8b84e; --unsure-soft: #2e2915;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --ink: #e2e9e4; --muted: #92a097; --line: #29312c;
  --accent: #74c095; --accent-soft: #1d2b23;
  --ok: #7cc485; --ok-soft: #1b2b1d; --change: #eba06a; --change-soft: #33231a; --unsure: #d8b84e; --unsure-soft: #2e2915;
  color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.45 }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 14px 12px }
.titleline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px }
h1 { font-family: var(--f-cond); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: .01em; text-wrap: balance }
.scheme { font-family: var(--f-mono); font-size: 13px; color: var(--muted) }
.progress { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center }
.meter { flex: 1 1 200px; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; min-width: 120px }
.meter i { display: block; height: 100% }
.meter .m-ok { background: var(--ok) } .meter .m-ch { background: var(--change) }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center }
.chip { font: 500 13px var(--f-sans); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#q { flex: 1 1 220px; min-width: 0; font: 14px var(--f-sans); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink) }
.tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--line) }
.tab { font: 600 14px var(--f-cond); letter-spacing: .02em; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 6px 12px; margin-bottom: -1px; cursor: pointer }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.tab .tcount { font: 400 12px var(--f-sans); color: var(--muted); font-variant-numeric: tabular-nums }
.tag.retag { background: var(--accent-soft); color: var(--accent) }
.meta.retag { color: var(--accent) }
.sortsel { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); padding-left: 6px; border-left: 1px solid var(--line) }
.sortsel[hidden] { display: none }
.setfield { display: grid; gap: 4px; margin-top: 12px; font-size: 13px; color: var(--muted); max-width: 420px }
.setfield input { font: 15px var(--f-mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 8em }
.setex { font-size: 16px; font-weight: 500; margin: 10px 0 0 }
.tag.moved { background: var(--accent-soft); color: var(--accent) }
.acts select.moveto { font: 13px var(--f-sans); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 6px; background: var(--surface); color: var(--ink); max-width: 14em }
.famline { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted) }
.famline select { font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; background: var(--surface); color: var(--ink) }
.famline.changed select { border-color: var(--accent); color: var(--accent) }
.ptline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted) }
.ptchips { display: inline-flex; gap: 4px; flex-wrap: wrap }
.ptag { display: inline-flex; align-items: center; gap: 2px; font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 2px 0 6px; color: var(--ink); background: var(--surface) }
.ptag.fam { padding-right: 6px; font-weight: 600 }
.ptrm { font: 13px var(--f-sans); line-height: 1; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 1px 4px; border-radius: 3px }
.ptrm:hover { color: var(--change); background: var(--change-soft) }
.ptadd, .ptfilter { font: 12px var(--f-sans); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; background: var(--surface); color: var(--muted) }
.ptfilter { font-size: 13px; padding: 4px 6px; border-radius: 999px }
.ptline.changed .ptag:not(.fam) { border-color: var(--accent); color: var(--accent) }
.famtable { border-collapse: collapse; margin-top: 12px; font-size: 14px; font-variant-numeric: tabular-nums }
.famtable th, .famtable td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line) }
.famtable th { font: 600 12px var(--f-sans); color: var(--muted); text-transform: uppercase; letter-spacing: .04em }
.famtable td.n { text-align: right }
.famtable td:first-child { font-family: var(--f-mono) }
.famadd { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap }
.famadd input { font: 14px var(--f-mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink) }
.status { font-size: 12px; color: var(--muted); margin-top: 8px }
.status.warn { color: var(--change) }
.keys { font-size: 12px; color: var(--muted); margin-top: 4px }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--ink) }

section.group { margin-top: 28px }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink) }
.ghead h2 { font-family: var(--f-cond); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 0 }
.gcount { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.gall { margin-left: auto; font: 500 12px var(--f-sans); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; padding: 3px 9px; cursor: pointer }
.gall:hover { color: var(--ok); border-color: var(--ok) }

.row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); outline: none }
.row .stripe { grid-row: 1 / span 2; border-radius: 2px; background: transparent }
.row.st-ok .stripe { background: var(--ok) } .row.st-change .stripe { background: var(--change) }
.row.cur { background: var(--accent-soft) }
.main { min-width: 0 }
.prop { font-size: 16px; font-weight: 500; overflow-wrap: anywhere }
.prop .pfx { color: var(--muted); font-weight: 400 }
.prop.savedname { color: var(--ok); margin-top: 2px }
.prop.savedname .tag.saved { border-color: var(--ok); color: var(--ok) }
.row.st-change .prop:not(.savedname) { text-decoration: line-through; text-decoration-color: var(--change); text-decoration-thickness: 1.5px }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px }
.meta .h { opacity: .7 }
.tag { display: inline-block; font: 500 11px var(--f-sans); padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px }
.tag.unsure { background: var(--unsure-soft); color: var(--unsure) }
.tag.sugg { background: var(--change-soft); color: var(--change) }
.tag.saved { border: 1px solid var(--accent); color: var(--accent) }
.meta.saved { color: var(--accent) }
.tag.noted { background: var(--accent-soft); color: var(--accent) }
.acts { display: flex; gap: 6px; align-items: flex-start }
.acts button { font: 500 13px var(--f-sans); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap }
.acts .b-ok[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface) }
.acts .b-ch[aria-pressed="true"] { background: var(--change); border-color: var(--change); color: var(--surface) }
.acts .b-note[aria-pressed="true"] { border-color: var(--accent); color: var(--accent) }
.editor { grid-column: 2 / span 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px }
.editor label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0 }
.editor input, .editor textarea { font: 14px var(--f-sans); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0 }
.editor input { font-family: var(--f-mono); font-size: 13px }
.editor textarea { resize: vertical; min-height: 34px }
.gapply { font: 500 12px var(--f-sans); background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 5px; padding: 3px 9px; cursor: pointer; margin-left: auto }
.gapply.pending { background: var(--accent); color: var(--surface) }
.gapply + .gall { margin-left: 0 }
.ghint { font-size: 12px; color: var(--muted); margin: 6px 0 0 }
.tag.stale { background: var(--unsure-soft); color: var(--unsure) }
.row.st-stale .stripe { background: var(--unsure) }
.meta.was { font-family: var(--f-sans); font-style: italic }
#applyPanel { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); max-height: 50vh; overflow: auto }
#applyPanel p { margin: 0 0 6px }
#applyPanel .ptitle { font-weight: 600 }
#applyPanel .pwarn { color: var(--unsure); background: var(--unsure-soft); padding: 6px 8px; border-radius: 6px }
#applyPanel .plist { margin: 6px 0; padding-left: 18px; font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere }
#applyPanel .plist .old { color: var(--muted); text-decoration: line-through }
#applyPanel .plist .more { list-style: none; color: var(--muted); font-family: var(--f-sans) }
.pbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.pbtn { font: 500 13px var(--f-sans); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 12px; cursor: pointer }
.pbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.empty { color: var(--muted); padding: 24px 0 }
@media (max-width: 640px) {
  .row { grid-template-columns: 4px minmax(0, 1fr) }
  .acts { grid-column: 2; flex-wrap: wrap }
  .editor { grid-column: 2; grid-template-columns: minmax(0, 1fr) }
  .keys { display: none }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: background-color .15s } }
</style>
